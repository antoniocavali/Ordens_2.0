packages:
  - apps/*
  - packages/*

# Somente dependências explicitamente aprovadas podem executar scripts de instalação.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@nestjs/core': false
  msgpackr-extract: true
  '@scarf/scarf': false

# Correções de segurança em dependências transitivas (pnpm audit).
overrides:
  multer: '>=2.3.0'
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.22.0'

minimumReleaseAgeExclude:
  - zod@4.6.1
