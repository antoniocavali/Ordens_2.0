packages:
  - apps/*
  - packages/*

# Somente dependências explicitamente aprovadas podem executar scripts de instalação.
allowBuilds:
  '@prisma/engines': true
  prisma: true
  '@swc/core': true
  esbuild: true
  sharp: true
  unrs-resolver: true
  '@nestjs/core': false
  msgpackr-extract: true
  '@scarf/scarf': false

# Correções de segurança em dependências transitivas (pnpm audit).
overrides:
  multer: '>=2.3.0'
  deepmerge-ts: '>=8.0.0'
  mysql2: '>=3.22.0'
  # GHSA-w5hq-g745-h8pq (via exceljs); série 11 mantém a saída CommonJS usada pelo exceljs.
  'uuid@<11.1.1': ^11.1.1
  # GHSA-6j4f-fj2g-mc7p (negação de serviço por recursão), corrigido nas três linhas em uso.
  'brace-expansion@1': ^1.1.20
  'brace-expansion@2': ^2.1.6
  'brace-expansion@5': ^5.0.11
  # GHSA-jqcg-44mw-7w3h (falsificação de IP por sub-rede IPv6 mapeada), via express.
  proxy-addr: '>=2.0.8'
  # GHSA-68fv-2mgg-jv7q (negação de serviço em source maps), via next > postcss.
  source-map-js: '>=1.2.2'

minimumReleaseAgeExclude:
  - zod@4.6.1
