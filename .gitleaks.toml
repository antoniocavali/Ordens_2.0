title = "Ordens — configuração do Gitleaks"

[extend]
useDefault = true

# Falsos positivos revisados: referências a variáveis de ambiente, não valores literais.
[[allowlists]]
description = "Credenciais S3 lidas de variáveis de ambiente validadas (env.S3_SECRET_KEY)"
regexTarget = "line"
regexes = ['''secretAccessKey:\s*env\.S3_SECRET_KEY''']
