# Ambiente completo. Em desenvolvimento, docker-compose.override.yml é carregado automaticamente
# (hot reload). Para simular produção localmente: docker compose -f docker-compose.yml up --build
# Portas de host configuráveis via *_HOST_PORT no .env (evita conflito com outros projetos).
name: ordens

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: ${DATABASE_URL}
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
  S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-ordens-quarantine}
  S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-ordens-documents}
  UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-2147483648}
  SCANNER: ${SCANNER:-noop}
  CLAMAV_HOST: ${CLAMAV_HOST:-clamav}
  CLAMAV_PORT: ${CLAMAV_PORT:-3310}
  WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
  SESSION_SECRET: ${SESSION_SECRET}
  TWO_FACTOR_ENC_KEY: ${TWO_FACTOR_ENC_KEY}
  SESSION_IDLE_HOURS: ${SESSION_IDLE_HOURS:-12}
  SESSION_ABSOLUTE_DAYS: ${SESSION_ABSOLUTE_DAYS:-7}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  MAIL_FROM: ${MAIL_FROM:-Ordens <nao-responda@ordens.local>}

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ordens}
      ORDENS_OWNER_PASSWORD: ${ORDENS_OWNER_PASSWORD}
      ORDENS_APP_PASSWORD: ${ORDENS_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - '${HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redisdata:/data
    ports:
      - '${HOST_BIND:-127.0.0.1}:${REDIS_HOST_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  minio:
    # Docker Hub não publica mais as imagens do MinIO; quay.io é o registry oficial.
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000}
    volumes:
      - miniodata:/data
    ports:
      - '${HOST_BIND:-127.0.0.1}:${MINIO_HOST_PORT:-9000}:9000'
      - '${HOST_BIND:-127.0.0.1}:${MINIO_CONSOLE_HOST_PORT:-9001}:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_QUARANTINE: ${S3_BUCKET_QUARANTINE:-ordens-quarantine}
      S3_BUCKET_DOCUMENTS: ${S3_BUCKET_DOCUMENTS:-ordens-documents}
    entrypoint: ['/bin/sh', '/init/init-buckets.sh']
    volumes:
      - ./docker/minio:/init:ro
    networks: [backend]

  mailpit:
    image: axllent/mailpit:v1.27
    restart: unless-stopped
    ports:
      - '${HOST_BIND:-127.0.0.1}:${MAILPIT_UI_HOST_PORT:-8025}:8025'
      - '${HOST_BIND:-127.0.0.1}:${MAILPIT_SMTP_HOST_PORT:-1025}:1025'
    networks: [backend]

  clamav:
    image: clamav/clamav:1.4
    profiles: ['scan']
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    networks: [backend]

  migrate:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL}
      DATABASE_URL: ${DATABASE_URL}
      SEED_DEMO: ${SEED_DEMO:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-}
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: api
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      API_PORT: 4000
    ports:
      - '${HOST_BIND:-127.0.0.1}:${API_HOST_PORT:-4000}:4000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [backend, frontend]

  worker:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: worker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: 4100
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:4100/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4000}
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - '${HOST_BIND:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [frontend]

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  backend:
  frontend:
