version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      nestjs:
        patterns: ['@nestjs/*']
      prisma:
        patterns: ['prisma', '@prisma/*']
      radix:
        patterns: ['@radix-ui/*']
      tanstack:
        patterns: ['@tanstack/*']
    ignore:
      # Tipos do Node acompanham o runtime (Node 24, ver .nvmrc); sobem junto com a troca de versão do Node.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
