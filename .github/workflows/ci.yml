name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, unit e build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ordens/db generate
      - run: pnpm --filter @ordens/contracts build && pnpm --filter @ordens/db build
      - run: pnpm turbo run typecheck
      - run: pnpm turbo run lint
      - run: pnpm turbo run test
      - run: pnpm turbo run build --filter=@ordens/api --filter=@ordens/worker --filter=@ordens/web

  integration:
    name: Integração (RLS como ordens_app)
    runs-on: ubuntu-24.04
    needs: quality
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordens
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
    env:
      NODE_ENV: test
      MIGRATION_DATABASE_URL: postgresql://ordens_owner:owner@localhost:5432/ordens
      DATABASE_URL: postgresql://ordens_app:app@localhost:5432/ordens
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Criar roles do banco
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ordens -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ordens_owner LOGIN PASSWORD 'owner' NOSUPERUSER NOBYPASSRLS CREATEDB;
          CREATE ROLE ordens_app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE ordens OWNER TO ordens_owner;
          ALTER SCHEMA public OWNER TO ordens_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO ordens_app;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          SQL
      - run: pnpm --filter @ordens/contracts build && pnpm --filter @ordens/db build
      - run: pnpm --filter @ordens/db migrate:deploy
      - run: SEED_DEMO=false node packages/db/dist/seed/run.js
      - run: pnpm --filter @ordens/db test:integration

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-24.04
    needs: quality
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ordens
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
      # E-mails dos avisos (Q44) conferidos pelo E2E na API do Mailpit.
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
      # Compartilhamento SMB real para a cópia do XML da Fazenda (worker usa smbclient).
      # Credencial só de teste, válida apenas dentro do runner.
      samba:
        image: dockurr/samba@sha256:404f91bdf317d390241a41165579cd25199f34171b44677d877c75dc40184042
        env:
          NAME: Fiscal
          USER: ordens-ci
          PASS: somente-teste-ci
        ports: ['445:445']
    env:
      NODE_ENV: test
      LOG_LEVEL: info
      MIGRATION_DATABASE_URL: postgresql://ordens_owner:owner@localhost:5432/ordens
      DATABASE_URL: postgresql://ordens_app:app@localhost:5432/ordens
      REDIS_URL: redis://localhost:6379
      API_PORT: '4000'
      API_INTERNAL_URL: http://localhost:4000
      WEB_ORIGIN: http://localhost:3020
      WEB_URL: http://localhost:3020
      S3_ENDPOINT: http://localhost:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ordens-ci
      S3_FORCE_PATH_STYLE: 'true'
      S3_BUCKET_QUARANTINE: ordens-quarantine
      S3_BUCKET_DOCUMENTS: ordens-documents
      SCANNER: noop
      COOKIE_SECURE: 'false'
      SMTP_HOST: localhost
      E2E_XML_ARCHIVE_PATH: '\\localhost\Fiscal\xml'
      E2E_XML_ARCHIVE_USER: ordens-ci
      E2E_XML_ARCHIVE_PASS: somente-teste-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cliente SMB (cópia do XML para a pasta de rede)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq smbclient

      # Segredos efêmeros por execução: nada fixo no repositório.
      - name: Gerar segredos da execução
        run: |
          for name in SESSION_SECRET TWO_FACTOR_ENC_KEY; do
            value=$(openssl rand -base64 32)
            echo "::add-mask::$value"
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          s3=$(openssl rand -hex 24)
          demo="E2e-$(openssl rand -hex 12)"
          echo "::add-mask::$s3"
          echo "::add-mask::$demo"
          {
            echo "S3_SECRET_KEY=$s3"
            echo "SEED_DEMO_PASSWORD=$demo"
            echo "E2E_PASSWORD=$demo"
          } >> "$GITHUB_ENV"

      - name: Object storage compatível com S3 e buckets privados
        run: |
          docker run -d --name s3 -p 9000:4566 \
            -e SERVICES=s3 -e AWS_DEFAULT_REGION="$S3_REGION" \
            -e AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" -e AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" \
            -e EXTRA_CORS_ALLOWED_ORIGINS="$WEB_ORIGIN" \
            localstack/localstack:4.0
          timeout 120 bash -c 'until curl -sf http://localhost:9000/_localstack/health | grep -q "\"s3\": \"available\""; do sleep 2; done'
          export AWS_ACCESS_KEY_ID="$S3_ACCESS_KEY" AWS_SECRET_ACCESS_KEY="$S3_SECRET_KEY" AWS_DEFAULT_REGION="$S3_REGION"
          for b in "$S3_BUCKET_QUARANTINE" "$S3_BUCKET_DOCUMENTS"; do
            aws --endpoint-url http://localhost:9000 s3api create-bucket --bucket "$b"
          done

      - name: Criar roles do banco
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ordens -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE ordens_owner LOGIN PASSWORD 'owner' NOSUPERUSER NOBYPASSRLS CREATEDB;
          CREATE ROLE ordens_app LOGIN PASSWORD 'app' NOSUPERUSER NOBYPASSRLS;
          ALTER DATABASE ordens OWNER TO ordens_owner;
          ALTER SCHEMA public OWNER TO ordens_owner;
          REVOKE ALL ON SCHEMA public FROM PUBLIC;
          GRANT USAGE ON SCHEMA public TO ordens_app;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE EXTENSION IF NOT EXISTS pg_trgm;
          SQL

      - run: pnpm --filter @ordens/db generate
      - run: pnpm turbo run build --filter=@ordens/api --filter=@ordens/worker --filter=@ordens/web
      - run: pnpm --filter @ordens/db migrate:deploy
      - name: Seed demo
        run: SEED_DEMO=true node packages/db/dist/seed/run.js > seed.log 2>&1 || (cat seed.log; exit 1)

      - name: Subir API, worker e web
        run: |
          mkdir -p e2e-logs
          nohup node apps/api/dist/main.js > e2e-logs/api.log 2>&1 &
          nohup node apps/worker/dist/main.js > e2e-logs/worker.log 2>&1 &
          cp -r apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          cp -r apps/web/public apps/web/.next/standalone/apps/web/public
          PORT=3020 HOSTNAME=127.0.0.1 nohup node apps/web/.next/standalone/apps/web/server.js > e2e-logs/web.log 2>&1 &
          timeout 90 bash -c 'until curl -sf http://localhost:4000/health/ready; do sleep 2; done' || (cat e2e-logs/api.log; exit 1)
          timeout 60 bash -c 'until curl -sf http://localhost:4100/health; do sleep 2; done' || (cat e2e-logs/worker.log; exit 1)
          timeout 60 bash -c 'until curl -sf -o /dev/null http://localhost:3020/login; do sleep 2; done' || (cat e2e-logs/web.log; exit 1)

      - run: pnpm --filter @ordens/web exec playwright install --with-deps chromium
      - run: pnpm --filter @ordens/web e2e
        env:
          CI: 'true'

      - name: Artefatos da falha
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
            e2e-logs
          retention-days: 7

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - name: Build das imagens
        run: |
          for target in migrate api worker web; do
            docker buildx build --target "$target" -f docker/app.Dockerfile -t "ordens-$target:ci" --load .
          done
      - name: Trivy (imagem da API)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ordens-api:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
