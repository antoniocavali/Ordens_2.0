name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/ordens

jobs:
  images:
    name: Publicar imagens no GHCR
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [migrate, api, worker, web]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/app.Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:main
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}

  migrate:
    name: Migration (job explícito de release)
    runs-on: ubuntu-24.04
    needs: images
    environment: production
    if: vars.DEPLOY_ENABLED == 'true'
    steps:
      - name: Executar migrations uma única vez antes da nova versão
        run: |
          docker run --rm \
            -e NODE_ENV=production \
            -e MIGRATION_DATABASE_URL="${{ secrets.MIGRATION_DATABASE_URL }}" \
            ${{ env.IMAGE_PREFIX }}-migrate:${{ github.sha }}
